<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>
  <div class="desktop-caption" aria-hidden="true"><span class="caption-dot"></span> MUSIC FOLDER ALARM <span class="caption-separator">/</span> INTERACTIVE PREVIEW</div>
  <div class="app-shell" id="appShell">
    <header class="app-header">
      <div class="brand-mark" aria-hidden="true"><span>♫</span></div>
      <div class="brand-copy"><div class="brand-name">Music Folder <strong>Alarm</strong></div></div>
      <div class="header-actions">
        <button class="icon-button" id="searchButton" aria-label="Search" title="Search"></button>
        <button class="icon-button" id="settingsButton" aria-label="Settings" title="Settings"></button>
      </div>
    </header>
    <div class="app-content" id="appMain" tabindex="-1"></div>
    <nav class="bottom-nav" id="bottomNav" aria-label="Main navigation"></nav>
  </div>
  <div id="overlayRoot"></div>
  <div class="toast-stack" id="toastStack" role="status" aria-live="polite"></div>
  <input type="file" id="folderInput" webkitdirectory directory multiple accept="audio/*,.mp3,.m4a,.wav,.ogg,.flac,.aac,.opus" hidden>
  <script>
/* Music Folder Alarm — interactive browser prototype (V9).
   Everything runs locally; no backend, account, or third-party JS required. */
(() => {
  'use strict';

  const STORAGE_KEY = 'music-folder-alarm-web-v1';
  const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const EVERY = [0,1,2,3,4,5,6];
  const WEEKDAYS = [1,2,3,4,5];
  const WEEKENDS = [0,6];
  const ICONS = {
    search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>',
    settings:'<path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06-1.91 1.91-.06-.06A1.65 1.65 0 0 0 16 18.4a1.65 1.65 0 0 0-1 1.5V20h-2.7v-.1a1.65 1.65 0 0 0-1-1.5 1.65 1.65 0 0 0-1.82.33l-.06.06-1.91-1.91.06-.06A1.65 1.65 0 0 0 7.9 15a1.65 1.65 0 0 0-1.5-1H6.3v-2.7h.1a1.65 1.65 0 0 0 1.5-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06L9.42 6.5l.06.06A1.65 1.65 0 0 0 11.3 6.9a1.65 1.65 0 0 0 1-1.5V5.3H15v.1a1.65 1.65 0 0 0 1 1.5 1.65 1.65 0 0 0 1.82-.33l.06-.06 1.91 1.91-.06.06A1.65 1.65 0 0 0 19.4 10.3a1.65 1.65 0 0 0 1.5 1h.1V14h-.1a1.65 1.65 0 0 0-1.5 1Z" transform="translate(-1.65 -1.65)"/>',
    alarm:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 1.5M5 3 2 6m17-3 3 3M6 21l1.5-2m10.5 2-1.5-2"/>',
    music:'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
    history:'<path d="M3 12a9 9 0 1 0 2.5-6.2L3 8"/><path d="M3 3v5h5m4-1v5l3 2"/>',
    plus:'<path d="M12 5v14M5 12h14"/>',
    minus:'<path d="M5 12h14"/>',
    folder:'<path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10H3z"/>',
    shuffle:'<path d="m18 14 4 4-4 4M18 2l4 4-4 4M2 18h3c5 0 7-12 12-12h5M2 6h3c2.5 0 4.3 2.5 6 5m3 2c1.2 2.6 2.4 5 5 5h3"/>',
    play:'<path d="m8 5 12 7-12 7z"/>',
    pause:'<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>',
    previous:'<path d="M6 5v14m13-14L8 12l11 7z"/>',
    next:'<path d="M18 5v14M5 5l11 7-11 7z"/>',
    edit:'<path d="M12 20h9M4 16.5V20h3.5L19 8.5 15.5 5 4 16.5zM14.5 6l3.5 3.5"/>',
    trash:'<path d="M3 6h18m-2 0-1 15H6L5 6m3 0V4h8v2M10 10v7m4-7v7"/>',
    close:'<path d="M18 6 6 18M6 6l12 12"/>',
    volume:'<path d="M11 5 6 9H3v6h3l5 4zM15 9a5 5 0 0 1 0 6m3-9a9 9 0 0 1 0 12"/>',
    info:'<circle cx="12" cy="12" r="10"/><path d="M12 11v6m0-10h.01"/>',
    check:'<path d="m4 12 5 5L20 6"/>',
    warning:'<path d="m10.3 3.6-8.1 14A2 2 0 0 0 4 20.6h16a2 2 0 0 0 1.8-3l-8.1-14a2 2 0 0 0-3.4 0ZM12 9v4m0 4h.01"/>',
    calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',
    upload:'<path d="M12 16V3m-5 5 5-5 5 5M4 17v4h16v-4"/>',
    bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9m-8 12h4"/>',
    rotate:'<path d="M3 12a9 9 0 1 1 3 6.7M3 19v-5h5"/>',
    repeat:'<path d="m17 2 4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/>',
    headphones:'<path d="M3 14v-3a9 9 0 0 1 18 0v3M3 14h4v7H5a2 2 0 0 1-2-2zm18 0h-4v7h2a2 2 0 0 0 2-2z"/>',
    chevron:'<path d="m9 18 6-6-6-6"/>',
    clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    spark:'<path d="m12 3 1.9 6.1L20 11l-6.1 1.9L12 19l-1.9-6.1L4 11l6.1-1.9zM19 18l.6 1.4L21 20l-1.4.6L19 22l-.6-1.4L17 20l1.4-.6z"/>'
  };
  const icon = (name, size=20) => `<svg aria-hidden="true" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[name] || ICONS.info}</svg>`;
  const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const uid = () => typeof crypto !== 'undefined' && crypto.randomUUID ? crypto.randomUUID() : `id-${Date.now()}-${Math.random().toString(36).slice(2)}`;
  const defaultState = () => ({alarms:[],folders:[],history:[],recent:[],selectedFolderId:'',lastFired:{},startHistory:{},alarmsMasterEnabled:true,masterAlarmDefaultV8Applied:true,settings:{volume:75,defaultShuffle:true,lowBatteryVoice:false}});
  function loadState(){
    try {
      const parsed=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');
      if(!parsed||typeof parsed!=='object')return defaultState();
      const defaults=defaultState();
      const folders=Array.isArray(parsed.folders)?parsed.folders.filter(f=>f&&f.id!=='demo'):[];
      const seen=new Set();
      const dedupedFolders=folders.filter(f=>{const key=String(f.id||f.name).toLowerCase();if(seen.has(key))return false;seen.add(key);return true;});
      const alarms=(Array.isArray(parsed.alarms)?parsed.alarms:[]).filter(a=>a&&a.id!=='sample-morning-alarm').map(a=>({...a,folderId:a.folderId==='demo'?'':a.folderId,volumeVariable:a.volumeVariable!==false,volumeMin:Number.isFinite(Number(a.volumeMin))&&Number(a.volumeMin)>=10?Number(a.volumeMin):10,volumeMax:Math.min(16,Math.max(10,Number(a.volumeMax)||16))}));
      return {...defaults,...parsed,alarms,folders:dedupedFolders,selectedFolderId:parsed.selectedFolderId==='demo'?'':(parsed.selectedFolderId||''),alarmsMasterEnabled:parsed.masterAlarmDefaultV8Applied===true ? parsed.alarmsMasterEnabled!==false : true,masterAlarmDefaultV8Applied:true,history:Array.isArray(parsed.history)?parsed.history.filter((h,i,all)=>h.type==='success'||all.slice(0,i+1).filter(x=>x.type!=='success').length<=20):[],recent:Array.isArray(parsed.recent)?parsed.recent:[],settings:{...defaults.settings,...parsed.settings}};
    }catch{return defaultState();}
  }
  let state = loadState();
  const save = () => { try { const snapshot=JSON.stringify(state);localStorage.setItem(STORAGE_KEY,snapshot);if(window.AndroidAlarm)window.AndroidAlarm.syncAlarms(snapshot); } catch { toast('Storage is full or unavailable. Changes may not persist.'); } };
  let folderSearch = '', nowTrackSearch = '', folderTrackLimit=80;
  let tab = 'alarms', playerTab = 'now', historyFilter = 'all', searchTerm = '', editor = null, pickerIntent = 'player';
  let runtimeFolders = new Map();
  let currentTrack = null, currentQueue = [], queueIndex = -1, manualShuffle = false, isPlaying = false;
  let repeatOne = false, lastFolderShuffleId = null, previewAlarm = null;
  let alarmPlayback = null, playbackToken = 0, activeVolumeRule = null;
  let batteryMonitor = null;
  let nativePosition=0,nativeDuration=0,nativeLastTrack='';
  const audio = new Audio();
  audio.preload = 'metadata';
  audio.volume = Math.max(1/16,Math.min(1,state.settings.volume/100));
  const appMain = document.getElementById('appMain');
  const nav = document.getElementById('bottomNav');
  const overlayRoot = document.getElementById('overlayRoot');
  const folderInput = document.getElementById('folderInput');

  function toast(message){
    const container = document.getElementById('toastStack');
    const element = document.createElement('div'); element.className='toast';element.textContent=message;
    container.appendChild(element); setTimeout(()=>element.remove(),4200);
  }
  function logHistory(type,title,detail='',alarmId=null){
    state.history.unshift({id:uid(),type,title,detail,alarmId,at:new Date().toISOString()});
    state.history=state.history.filter((h,i)=>h.type==='success'||state.history.slice(0,i+1).filter(x=>x.type!=='success').length<=20);save();
    if(tab==='history')renderMain(false);
  }
  function fmtTime(hour,minute){let h=hour%12||12;return {time:`${h}:${String(minute).padStart(2,'0')}`,ampm:hour<12?'AM':'PM'};}
  function fmtDuration(seconds){if(!Number.isFinite(seconds))return '0:00';return `${Math.floor(seconds/60)}:${String(Math.floor(seconds%60)).padStart(2,'0')}`;}
  function repeatText(alarm){
    if(alarm.once)return 'One time';
    const days=Array.isArray(alarm.days)?alarm.days:EVERY;
    if(days.length===7)return 'Every day';
    if(days.length===5 && WEEKDAYS.every(d=>days.includes(d)))return 'Weekdays';
    if(days.length===2 && WEEKENDS.every(d=>days.includes(d)))return 'Weekends';
    return DAYS.filter((_,index)=>days.includes(index)).join(' · ')||'No days';
  }
  function nextOccurrence(alarm,from=new Date()){
    for(let i=0;i<=7;i++){
      const candidate=new Date(from);candidate.setHours(alarm.hour,alarm.minute,0,0);candidate.setDate(from.getDate()+i);
      if(candidate<=from)continue;
      if(alarm.once || (alarm.days||EVERY).includes(candidate.getDay()))return candidate;
    }
    return null;
  }
  function nextAlarm(){
    if(!state.alarmsMasterEnabled)return null;
    return state.alarms.filter(a=>a.enabled).map(a=>({alarm:a,date:nextOccurrence(a)})).filter(x=>x.date).sort((a,b)=>a.date-b.date)[0];
  }
  function dateLabel(date){
    const today=new Date(); const tomorrow=new Date(today);tomorrow.setDate(today.getDate()+1);
    const day=date.toDateString()===today.toDateString()?'Today':date.toDateString()===tomorrow.toDateString()?'Tomorrow':date.toLocaleDateString(undefined,{weekday:'short'});
    const f=fmtTime(date.getHours(),date.getMinutes());return `${day}, ${f.time} ${f.ampm}`;
  }
  function getFolders(){return state.folders;}
  function getFolder(id){return getFolders().find(folder=>folder.id===id);}
  function getTracks(id){return runtimeFolders.get(id)||[];}
  function allTracks(){return getFolders().flatMap(folder=>getTracks(folder.id).map(track=>({...track,folderId:folder.id,folderName:folder.name})));}
  function trackById(id){return allTracks().find(track=>track.id===id);}
  function folderOptions(selected){return getFolders().map(f=>`<option value="${esc(f.id)}" ${selected===f.id?'selected':''}>${esc(f.name)}</option>`).join('');}
  function renderNav(){
    nav.innerHTML=[['alarms','alarm','Alarms'],['player','music','Player'],['history','history','History']].map(([id,ic,title])=>`<button type="button" class="nav-item ${tab===id?'active':''}" data-action="tab" data-id="${id}" aria-current="${tab===id?'page':'false'}">${icon(ic)}<span>${title}</span></button>`).join('');
  }
  function renderMain(resetScroll=true){
    const previous=appMain.scrollTop;
    appMain.classList.add('compact-heading-view');
    appMain.innerHTML=tab==='alarms'?renderAlarms():tab==='player'?renderPlayer():renderHistory();
    appMain.scrollTop=resetScroll?0:previous;
    renderNav();
  }
  function navigate(target){tab=target;renderMain();}
  function renderAlarms(){
    const active=state.alarmsMasterEnabled?state.alarms.filter(a=>a.enabled).length:0;
    const next=nextAlarm();
    const sorted=[...state.alarms].sort((a,b)=>(Number(b.enabled)-Number(a.enabled)) || (a.hour*60+a.minute)-(b.hour*60+b.minute));
    return `<div class="section-top"><div><h1 class="section-title">Your Alarms</h1></div></div>
      <button class="primary-button wide" data-action="new-alarm">${icon('plus',18)} Add Alarm</button>
      <div class="stat-row"><div class="stat-card"><div class="stat-label">Active alarms</div><div class="stat-value stat-accent">${active}<span style="font-size:14px;color:var(--muted)"> / ${state.alarms.length}</span></div></div><div class="stat-card"><div class="stat-label">Up next</div><div class="stat-value small">${next?esc(dateLabel(next.date)):'Nothing scheduled'}</div></div></div>
      <div class="section-label master-alarm-row"><div class="master-switch">${renderToggle('master-alarms',state.alarmsMasterEnabled)}<span class="master-status">${state.alarmsMasterEnabled?'Alarms on':'Alarms off'}</span></div><h3>Scheduled alarms</h3><span>${state.alarms.length} total</span></div>
      ${sorted.length?sorted.map(renderAlarmCard).join(''):`<div class="empty-state"><div class="empty-graphic">${icon('alarm',30)}</div><h3>No alarms yet</h3><p>Create your first music alarm and choose a folder to play when the time comes.</p><button class="secondary-button" data-action="new-alarm">${icon('plus',16)} Create alarm</button></div>`}
      <div class="hint-box">${icon('info',16)}<span><strong>${window.AndroidAlarm?'Android alarms active':'Browser prototype'}</strong>: ${window.AndroidAlarm?'Schedules are registered with Android and do not require this screen to stay open.':'Scheduled alarms are checked only while this page is running.'}</span></div>`;
  }
  function renderAlarmCard(alarm){
    const f=fmtTime(alarm.hour,alarm.minute),folder=getFolder(alarm.folderId);
    return `<article class="alarm-card ${alarm.enabled&&state.alarmsMasterEnabled?'enabled':''}" data-action="preview-alarm" data-id="${esc(alarm.id)}" title="Open this alarm in the music player" tabindex="0"><div class="alarm-card-main"><div class="alarm-card-copy"><div class="alarm-time">${f.time}<span class="ampm">${f.ampm}</span></div><div class="alarm-name">${esc(alarm.name)}</div><div class="alarm-repeat">${esc(repeatText(alarm))}</div></div><label class="toggle" aria-label="Enable ${esc(alarm.name)}"><input type="checkbox" data-action="toggle-alarm" data-id="${esc(alarm.id)}" ${alarm.enabled?'checked':''}><span class="toggle-track"></span></label></div><div class="alarm-card-footer"><span class="tiny-chip" title="Music folder">${icon('folder',13)} ${esc(folder?.name||'No folder')}</span>${alarm.shuffle?`<span class="tiny-chip accent" title="Smart shuffle">${icon('shuffle',13)} Smart</span>`:''}<div class="alarm-actions"><button class="mini-action" title="Test now" aria-label="Test ${esc(alarm.name)}" data-action="test-alarm" data-id="${esc(alarm.id)}">${icon('play',15)}</button><button class="secondary-button alarm-edit-large" title="Edit" aria-label="Edit ${esc(alarm.name)}" data-action="edit-alarm" data-id="${esc(alarm.id)}">${icon('edit',17)} Edit</button></div></div></article>`;
  }

    toast(`${alarm.name}: music unavailable — please reload its folder.`);
    updateMediaMetadata();if(tab==='player')renderMain(false);
  }
  function startQueue(queue,index=0,alarm=null){
    currentQueue=[...queue];queueIndex=index;alarmPlayback=alarm?{alarm,attempted:new Set(),logged:false}:null;
    playQueueIndex(index);
  }
  function playQueueIndex(index){
    if(index<0||index>=currentQueue.length){if(alarmPlayback)reportTrackFailure(alarmPlayback.alarm,'No playable tracks were found.');else toast('No track available.');return;}
    const track=currentQueue[index];queueIndex=index;currentTrack=track;
    updateMediaMetadata();
    const token=++playbackToken;
    let failed=false;
    const fail=(error)=>{
      if(failed||token!==playbackToken)return;failed=true;
      if(alarmPlayback){
        alarmPlayback.attempted.add(track.id);
        const next=currentQueue.findIndex(t=>!alarmPlayback.attempted.has(t.id));
        if(next>=0)playQueueIndex(next);
        else reportTrackFailure(alarmPlayback.alarm,`All ${currentQueue.length} track(s) failed: ${error?.message||'unreadable audio'}`);
      } else {isPlaying=false;logHistory('error','Track playback failed',`${track.name}: ${error?.message||'unreadable audio'}`);toast('Could not play this track. Try another file.');updateMediaMetadata();}
    };
    if(window.AndroidAlarm){
      try{window.AndroidAlarm.startPlayback(JSON.stringify(currentQueue),index,volumeStep());isPlaying=true;rememberRecent(track);updateMediaMetadata();if(tab==='player')renderMain(false);}catch(e){fail(e);}return;
    }
    audio.pause();audio.onerror=null;
    try{
      audio.src=track.fileObject?URL.createObjectURL(track.fileObject):track.file;
      audio.load();
      audio.onerror=()=>fail(new Error('Audio file could not be opened'));
      const attempt=audio.play();
      if(attempt&&typeof attempt.then==='function'){
        attempt.then(()=>{
          if(token!==playbackToken)return;
          isPlaying=true;rememberRecent(track);
          if(alarmPlayback&&!alarmPlayback.logged){alarmPlayback.logged=true;logHistory('success',`${alarmPlayback.alarm.name}: started playing`,`${track.name} · ${currentQueue.length} tracks available`,alarmPlayback.alarm.id);}
          if(tab==='player')renderMain(false);
          updateMediaMetadata();
        }).catch(fail);
      }
      if(tab==='player')renderMain(false);
    }catch(error){fail(error);}
  }
  function playShuffledFolderNow(){
    const tracks=getTracks(state.selectedFolderId);
    if(!tracks.length){toast('Add or reload a music folder before shuffling.');tab='player';playerTab='folders';renderMain();return;}
    const previous=lastFolderShuffleId||currentTrack?.id;
    const candidates=tracks.length>1?tracks.filter(track=>track.id!==previous):tracks;
    const start=candidates[Math.floor(Math.random()*candidates.length)];
    lastFolderShuffleId=start.id;
    manualShuffle=true;
    previewAlarm=null;
    activeVolumeRule=null;
    const queue=[start,...shuffleArray(tracks.filter(t=>t.id!==start.id))];
    tab='player';playerTab='now';
    nowTrackSearch='';
    startQueue(queue);
    renderMain();
  }
  function playTrackById(id){
    const track=trackById(id);if(!track){toast('Song is unavailable. Reload its folder.');return;}
    if(currentTrack?.id===id&&isPlaying){pausePlayback();return;}
    const folderId=track.folderId||getFolders().find(f=>getTracks(f.id).some(t=>t.id===id))?.id;
    if(folderId)state.selectedFolderId=folderId;
    const tracks=getTracks(state.selectedFolderId);
    const queue=manualShuffle?shuffleArray(tracks.filter(t=>t.id!==id)):[...tracks.filter(t=>t.id!==id)];
    activeVolumeRule=null;save();startQueue([track,...queue],0,null);
  }
  function triggerAlarm(alarm,manual=false){
    const tracks=getTracks(alarm.folderId);
    const low=alarm.volumeVariable!==false?Math.max(10,Number(alarm.volumeMin)||10):1,high=alarm.volumeVariable!==false?Math.max(low,Number(alarm.volumeMax)||16):16;
    activeVolumeRule=alarm.volumeVariable!==false?{low,high}:null;
    setVolume(Math.round(Math.max(low,Math.min(high,Number(alarm.volumeLevel||12)))/16*100));
    if(!manual)logHistory('warning',`${alarm.name}: scheduled trigger`,`The browser detected the scheduled time for this alarm and started attempting playback from its saved folder. This is a trigger event, not confirmation of a playback failure. Check for the subsequent successful-play or fallback event for the outcome.`,alarm.id);
    if(tracks.length){const queue=queueForAlarm(alarm,tracks);startQueue(queue,0,alarm);toast(`${alarm.name} · Starting music`);}
    else reportTrackFailure(alarm,alarm.folderId?'Folder unavailable or empty. Re-select the folder in the browser.':'No music folder selected.');
  }
  function checkAlarms(){
    if(window.AndroidAlarm)return; // Native AlarmManager is authoritative.
    if(!state.alarmsMasterEnabled)return;
    const now=new Date(),dateKey=`${now.getFullYear()}-${now.getMonth()+1}-${now.getDate()}`;
    for(const alarm of state.alarms){
      if(!alarm.enabled||alarm.hour!==now.getHours()||alarm.minute!==now.getMinutes())continue;
      if(!alarm.once&&!(alarm.days||EVERY).includes(now.getDay()))continue;
      const key=`${alarm.id}:${dateKey}:${alarm.hour}:${alarm.minute}`;
      if(state.lastFired[alarm.id]===key)continue;
      state.lastFired[alarm.id]=key;
      if(alarm.once)alarm.enabled=false;
      save();triggerAlarm(alarm);if(tab==='alarms')renderMain(false);
    }
  }
  function pausePlayback(){
    if(window.AndroidAlarm)window.AndroidAlarm.pause();else audio.pause();isPlaying=false;updateMediaMetadata();
    if(tab==='player')renderMain(false);
  }
  function togglePlayback(){
    if(isPlaying){pausePlayback();return;}
    if(window.AndroidAlarm&&currentTrack){window.AndroidAlarm.resume();isPlaying=true;renderMain(false);return;}
    if(currentTrack&&audio.src){audio.play().then(()=>{isPlaying=true;renderMain(false);}).catch(()=>toast('Browser blocked playback. Tap again.'));return;}
    const tracks=getTracks(state.selectedFolderId);
    if(previewAlarm){const alarm=previewAlarm;previewAlarm=null;triggerAlarm(alarm,true);return;}
    if(!tracks.length){toast('Choose a music folder first.');playerTab='folders';renderMain();return;}
    startQueue(manualShuffle?shuffleArray(tracks):tracks);
  }
  function nextTrack(direction=1){
    if(window.AndroidAlarm&&currentQueue.length){if(direction>0)window.AndroidAlarm.next();else window.AndroidAlarm.previous();return;}
    if(!currentQueue.length){togglePlayback();return;}
    let next=queueIndex+direction;
    if(next>=currentQueue.length)next=0;if(next<0)next=currentQueue.length-1;
    alarmPlayback=null;playQueueIndex(next);
  }
  // 1 is the lowest positive media volume in the preview; 16 is full output.
  // Android builds must map these 16 levels to AudioManager's actual media stream range.
  function volumeStep(){return Math.max(1,Math.min(16,Math.round((Number(state.settings.volume)||0)*16/100)));}
  function volumePercentForStep(step){return Math.round(Math.max(1,Math.min(16,step))/16*100);}
  function setVolume(value){
    state.settings.volume=Math.max(6.25,Math.min(100,Number(value)||6.25));
    audio.volume=state.settings.volume/100; if(window.AndroidAlarm)window.AndroidAlarm.setVolumeStep(volumeStep());save();
    const label=document.getElementById('volumeStepLabel');if(label)label.innerHTML=`${volumeStep()} <small>/ 16</small>`;
  }
  function changeVolume(direction){
    const current=volumeStep();
    const low=activeVolumeRule?.low||1,high=activeVolumeRule?.high||16;
    const next=Math.max(low,Math.min(high,current+direction));
    setVolume(volumePercentForStep(next));
    if(next===current)toast(direction>0?'Maximum volume reached':'Minimum volume reached');
  }
  function updateMediaMetadata(){
    if(!('mediaSession' in navigator))return;
    try{
      navigator.mediaSession.metadata=currentTrack&&typeof MediaMetadata!=='undefined'?new MediaMetadata({title:currentTrack.name,artist:currentTrack.artist||'Local music',album:currentTrack.folderName||getFolder(state.selectedFolderId)?.name||'Music Folder Alarm'}):null;
      navigator.mediaSession.playbackState=isPlaying?'playing':'paused';
    }catch{}
  }
  function setupMediaSession(){
    if(!('mediaSession' in navigator))return;
    for(const [name,fn] of [['play',()=>{if(!isPlaying)togglePlayback();}],['pause',()=>{if(isPlaying)pausePlayback();}],['previoustrack',()=>nextTrack(-1)],['nexttrack',()=>nextTrack(1)]]){
      try{navigator.mediaSession.setActionHandler(name,fn);}catch{}
    }
  }
  function updateProgress(){
    const seek=document.getElementById('seekRange'),elapsed=document.getElementById('elapsedTime'),total=document.getElementById('totalTime');
    const elapsedValue=window.AndroidAlarm?nativePosition:audio.currentTime, durationValue=window.AndroidAlarm?nativeDuration:audio.duration;
    if(seek)seek.value=Number.isFinite(durationValue)&&durationValue>0?Math.round(elapsedValue/durationValue*100):0;
    if(elapsed)elapsed.textContent=fmtDuration(elapsedValue);
    if(total)total.textContent=fmtDuration(durationValue||currentTrack?.duration||0);
  }
  function openAppPermissions(){
    // In the Android application, this bridge opens Settings > Apps > Music Folder Alarm.
    const bridge=window.AndroidAlarm || window.Android;
    if(bridge && typeof bridge.openAppPermissions==='function'){
      try{bridge.openAppPermissions();closeModal();return;}catch(error){console.warn('Cannot open Android app permissions',error);}
    }
    const body=`<div class="permissions-intro">${icon('settings',25)}<strong>App permissions</strong><p>On Android, this button opens the system permissions page for Music Folder Alarm, including notifications and other app permissions.</p></div>
      <div class="permission-line">${icon('bell',18)}<div><strong>Notifications</strong><span>Android media controls and alarm alerts</span></div>${icon('chevron',17)}</div>
      <div class="permission-line">${icon('alarm',18)}<div><strong>Alarms & reminders</strong><span>Exact alarm access, if required</span></div>${icon('chevron',17)}</div>
      <div class="permission-line">${icon('folder',18)}<div><strong>Music folder access</strong><span>Access granted to folders you select</span></div>${icon('chevron',17)}</div>
      <p class="inline-help" style="margin-top:18px">Browser preview only: a web page cannot launch the installed app’s Android Settings page. This button will open the real system settings when the native Android bridge is implemented.</p>`;
    overlayRoot.innerHTML=modalFrame('App permissions',body,`<button class="primary-button" data-action="open-settings">Back to settings</button>`);
  }
  function batterySetup(){
    if(!navigator.getBattery)return;
    navigator.getBattery().then(battery=>{
      batteryMonitor=battery;
      let lastLow=false;
      const check=()=>{
        const low=battery.level<=.2&&!battery.charging;
        if(low&&!lastLow&&state.settings.lowBatteryVoice&&'speechSynthesis' in window){
          try{const speech=new SpeechSynthesisUtterance('Battery is low. Please connect your charger.');window.speechSynthesis.speak(speech);}catch{}
        }
        lastLow=low;
      };
      battery.addEventListener('levelchange',check);battery.addEventListener('chargingchange',check);check();
    }).catch(()=>{});
  }
  function handleClick(event){
    const target=event.target.closest('[data-action]');if(!target)return;
    const action=target.dataset.action,id=target.dataset.id;
    if(action==='preview-alarm' && event.target.closest('button,input,label,a,select'))return;
    if(action==='close-overlay'&&event.target!==target)return;
    if(['toggle-alarm','master-alarms','editor-shuffle','editor-enabled','editor-variable','settings-shuffle','settings-battery'].includes(action))return;
    switch(action){
      case 'tab':navigate(id);break;
      case 'player-tab':playerTab=id;folderTrackLimit=80;renderMain(false);break;
      case 'load-more-tracks':folderTrackLimit+=80;{const panel=document.getElementById('folderTrackSearch')?.closest('.search-input-wrap')?.nextElementSibling;if(panel)panel.innerHTML=renderFolderTrackResults();}break;
      case 'new-alarm':openEditor();break;
      case 'preview-alarm':{const a=state.alarms.find(x=>x.id===id);if(a){previewAlarm=a;nowTrackSearch='';state.selectedFolderId=a.folderId;manualShuffle=!!a.shuffle;currentTrack=null;currentQueue=[];queueIndex=-1;isPlaying=false;alarmPlayback=null;activeVolumeRule=null;audio.pause();audio.removeAttribute('src');save();tab='player';playerTab='now';renderMain();toast('Alarm ready — press Play to use its saved rules.');}break;}
      case 'play-folder':{const folder=getFolder(id);if(!folder)break;state.selectedFolderId=id;save();const tracks=getTracks(id);tab='player';playerTab='now';nowTrackSearch='';if(tracks.length){activeVolumeRule=null;startQueue(manualShuffle?shuffleArray(tracks):tracks);renderMain();}else {renderMain();toast('Folder is saved, but music needs reloading. Add this folder again from your device.');}break;}
      case 'shuffle-folder':playShuffledFolderNow();break;
      case 'volume-down':changeVolume(-1);break;
      case 'volume-up':changeVolume(1);break;
      case 'repeat-one':repeatOne=!repeatOne;if(window.AndroidAlarm)window.AndroidAlarm.setRepeatOne(repeatOne);renderMain(false);break;
      case 'edit-alarm':{const alarm=state.alarms.find(a=>a.id===id);if(alarm)openEditor(alarm);break;}
      case 'test-alarm':{const alarm=state.alarms.find(a=>a.id===id);if(alarm)triggerAlarm(alarm,true);break;}
      case 'repeat-preset':editor.repeat=id;editor.once=id==='once';if(id==='every')editor.days=[...EVERY];if(id==='weekdays')editor.days=[...WEEKDAYS];if(id==='weekends')editor.days=[...WEEKENDS];renderEditor();break;
      case 'repeat-day':{const day=Number(id);editor.days=editor.days.includes(day)?editor.days.filter(d=>d!==day):[...editor.days,day].sort();renderEditor();break;}
      case 'save-alarm':saveAlarm();break;
      case 'close-modal':case 'close-overlay':closeModal();break;
      case 'browse-folder':requestFolder(target.dataset.intent||'player');break;
      case 'select-folder':chooseFolder(id);break;
      case 'open-folders':tab='player';playerTab='folders';renderMain();break;
      case 'play-track':playTrackById(id);break;
      case 'play-pause':togglePlayback();break;
      case 'previous':nextTrack(-1);break;
      case 'next':nextTrack(1);break;
      case 'shuffle-now':playShuffledFolderNow();break;
      case 'history-filter':historyFilter=id;renderMain(false);break;
      case 'clear-history':if(state.history.length&&window.confirm('Clear alarm history?')){state.history=[];save();renderMain(false);}break;
      case 'app-permissions':openAppPermissions();break;
      case 'open-settings':openSettings();break;
      case 'search-alarm':{const a=state.alarms.find(x=>x.id===id);closeModal();if(a){navigate('alarms');openEditor(a);}break;}
      case 'search-folder':closeModal();state.selectedFolderId=id;save();tab='player';playerTab='folders';renderMain();break;
      case 'search-track':closeModal();tab='player';playerTab='now';playTrackById(id);break;
    }
  }
  function handleAlarmCardKey(event){
    if((event.key==='Enter'||event.key===' ') && event.target.matches('.alarm-card[data-action="preview-alarm"]')){
      event.preventDefault();event.target.click();
    }
  }
  function handleChange(event){
    const target=event.target,action=target.dataset.action;
    if(target.dataset.editor){editor[target.dataset.editor]=target.value;const label=document.getElementById('startingVolumeLabel');if(label)label.textContent=editor.volumeLevel;updateEditorValidation();return;}
    switch(action){
      case 'master-alarms':state.alarmsMasterEnabled=target.checked;save();renderMain(false);toast(target.checked?'All scheduled alarms turned on':'All scheduled alarms turned off');break;
      case 'toggle-alarm':{const a=state.alarms.find(a=>a.id===target.dataset.id);if(a){a.enabled=target.checked;save();renderMain(false);}break;}
      case 'editor-shuffle':editor.shuffle=target.checked;break;
      case 'editor-variable':editor.volumeVariable=target.checked;break;
      case 'editor-enabled':editor.enabled=target.checked;break;
      case 'settings-shuffle':state.settings.defaultShuffle=target.checked;save();break;
      case 'settings-battery':state.settings.lowBatteryVoice=target.checked;save();break;
      case 'volume':setVolume(target.value);break;
      case 'seek':if(window.AndroidAlarm)window.AndroidAlarm.seek(Math.round(Number(target.value)));else if(Number.isFinite(audio.duration)&&audio.duration>0)audio.currentTime=audio.duration*Number(target.value)/100;break;
    }
  }
  function handleInput(event){
    const target=event.target;
    if(target.id==='nowTrackSearch'){nowTrackSearch=target.value;const box=document.getElementById('nowTrackResults');if(box)box.innerHTML=renderNowTrackResults(getTracks(state.selectedFolderId));return;}
    if(target.id==='folderTrackSearch'){folderSearch=target.value;folderTrackLimit=80;const box=target.closest('.search-input-wrap').nextElementSibling;if(box)box.innerHTML=renderFolderTrackResults();return;}
    if(target.id==='searchInput'){searchTerm=target.value;renderSearchResults();return;}
    if(target.dataset.editor){editor[target.dataset.editor]=target.value;const label=document.getElementById('startingVolumeLabel');if(label)label.textContent=editor.volumeLevel;updateEditorValidation();return;}
    if(target.dataset.action==='volume')setVolume(target.value);
    if(target.dataset.action==='seek'&&Number.isFinite(window.AndroidAlarm?nativeDuration:audio.duration)&& (window.AndroidAlarm?nativeDuration:audio.duration)>0){const elapsed=document.getElementById('elapsedTime');if(elapsed)elapsed.textContent=fmtDuration((window.AndroidAlarm?nativeDuration:audio.duration)*Number(target.value)/100);}
  }
  document.getElementById('searchButton').innerHTML=icon('search');
  document.getElementById('settingsButton').innerHTML=icon('settings');
  document.getElementById('searchButton').addEventListener('click',openSearch);
  document.getElementById('settingsButton').addEventListener('click',openSettings);
  document.addEventListener('click',handleClick);
  document.addEventListener('keydown',handleAlarmCardKey);
  document.addEventListener('change',handleChange);
  document.addEventListener('input',handleInput);
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&overlayRoot.innerHTML)closeModal();});
  folderInput.addEventListener('change',e=>onFolderFiles([...e.target.files]));
  audio.addEventListener('timeupdate',updateProgress);
  audio.addEventListener('loadedmetadata',()=>{if(currentTrack&&Number.isFinite(audio.duration))currentTrack.duration=audio.duration;updateProgress();});
  audio.addEventListener('ended',()=>{if(repeatOne){audio.currentTime=0;audio.play().catch(()=>toast('Unable to repeat track'));}else nextTrack(1);});
   audio.addEventListener('pause',()=>{isPlaying=false;const btn=document.getElementById('mainPlayButton');if(btn){btn.innerHTML=icon('play',26);btn.setAttribute('aria-label','Play');}document.getElementById('albumHero')?.classList.remove('playing');updateMediaMetadata();});
   audio.addEventListener('playing',()=>{isPlaying=true;const btn=document.getElementById('mainPlayButton');if(btn){btn.innerHTML=icon('pause',26);btn.setAttribute('aria-label','Pause');}document.getElementById('albumHero')?.classList.add('playing');updateMediaMetadata();});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkAlarms();});
  // Android sends exact-alarm delivery and playback progress independently of WebView activity.
  const receivingNativeFolders=new Map();
  window.musicAlarmNativeFolderPage=(meta,tracks,last,intent)=>{
    if(!meta||!meta.id)return;
    let collected=receivingNativeFolders.get(meta.id);
    if(!collected){collected=[];receivingNativeFolders.set(meta.id,collected);}
    for(const track of tracks||[])if(track)collected.push(track);
    if(last){
      receivingNativeFolders.delete(meta.id);
      applyNativeFolder({...meta,tracks:collected},intent,intent!=='restore');
      folderTrackLimit=80;
    }
  };
  window.musicAlarmNativeFolderChosen=(folder,intent)=>applyNativeFolder(folder,intent,true);
  window.musicAlarmNativeFolders=(folders)=>{
    for(const folder of folders||[])applyNativeFolder(folder,'restore',false);
    renderMain(false);
  };
  window.musicAlarmNativePlayback=(data)=>{
    if(!data)return;
    if(data.type==='stopped'){isPlaying=false;currentTrack=null;currentQueue=[];nativePosition=0;nativeDuration=0;renderMain(false);return;}
    if(Array.isArray(data.queue))currentQueue=data.queue;
    // Native events contain only the current track, not the entire queue.
    // Preserve the existing UI queue when it matches, and use a single-track
    // fallback on a restored screen or when a scheduled alarm changes folders.
    if(data.track){
      const match=(a,b)=>!!(a&&b&&(a.id&&b.id?a.id===b.id:a.file===b.file));
      const requested=Number(data.index)||0;
      if(match(currentQueue[requested],data.track))queueIndex=requested;
      else{
        const found=currentQueue.findIndex(t=>match(t,data.track));
        if(found>=0)queueIndex=found;
        else{currentQueue=[data.track];queueIndex=0;}
      }
    }else queueIndex=Number(data.index)||0;
    if(currentQueue[queueIndex]){
      currentTrack=currentQueue[queueIndex];
      const key=currentTrack.id||currentTrack.file;
      if(key!==nativeLastTrack){nativeLastTrack=key;rememberRecent(currentTrack);}
      const fid=currentTrack.folderId;if(fid&&getFolder(fid))state.selectedFolderId=fid;
    }
    isPlaying=!!data.playing;
    nativePosition=(Number(data.position)||0)/1000;
    nativeDuration=(Number(data.duration)||0)/1000;
    if(data.type==='error')toast(data.message||'Playback failed');
    updateMediaMetadata();if(tab==='player')renderMain(false);
  };
  window.musicAlarmNativeProgress=(data)=>{if(data){nativePosition=(Number(data.position)||0)/1000;nativeDuration=(Number(data.duration)||0)/1000;updateProgress();}};
  window.musicAlarmNativePermission=(allowed)=>{if(!allowed)toast('Enable Alarms & reminders in Android Settings to schedule your alarms.');};
  window.musicAlarmNativeEvents=(events)=>{
    for(const event of events||[]){
      const key='native:'+event.id;
      if(state.history.some(h=>h.id===key))continue;
      state.history.unshift({id:key,type:event.type,title:event.title,detail:event.detail,alarmId:event.alarmId||null,at:event.at});
    }
    state.history.sort((a,b)=>new Date(b.at)-new Date(a.at));
    state.history=state.history.filter((h,i)=>h.type==='success'||state.history.slice(0,i+1).filter(x=>x.type!=='success').length<=20);
    if(tab==='history')renderMain(false);
  };
  function applyNativeFolder(folder,intent,persist){
    if(!folder||!folder.id)return;
    runtimeFolders.set(folder.id,Array.isArray(folder.tracks)?folder.tracks:[]);
    const current=state.folders.find(f=>f.id===folder.id);
    if(current)Object.assign(current,{name:folder.name,count:folder.count});
    else state.folders.push({id:folder.id,name:folder.name,count:folder.count});
    if(intent!=='restore'){
      if(intent==='editor'&&editor){editor.folderId=folder.id;renderEditor();}
      else{state.selectedFolderId=folder.id;tab='player';playerTab='folders';}
    }
    if(persist)save();renderMain(false);
  }
  setupMediaSession();renderMain();save();
  if(!window.AndroidAlarm){checkAlarms();setInterval(checkAlarms,1000);}else{
    window.AndroidAlarm.checkExactAlarmAccess();window.AndroidAlarm.getEvents();
    setInterval(()=>{window.AndroidAlarm.getProgress();window.AndroidAlarm.getEvents();},1500);
  }
  batterySetup();
})();

</script>
